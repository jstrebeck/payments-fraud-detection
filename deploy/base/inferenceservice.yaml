# fraud-detector served by KServe (Standard/RawDeployment mode, ADR-0005).
# Reached in-cluster at
#   http://fraud-detector-predictor.fraud.svc/v2/models/fraud-detector/infer
# storageUri names the registry alias, not a version (ADR-0006). The homelab's
# `mlflow` ClusterStorageContainer resolves it when a predictor pod starts,
# downloads through the MLflow artifact proxy (no S3 credentials) and writes a
# model-settings.json so every V2 response carries `model_version`. Promotion
# or rollback = move the alias, then restart the predictor
# (scripts/promote.py does both; docs/runbooks/rollback-model.md).
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-detector
  namespace: fraud
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 2
    model:
      runtime: fraud-mlserver
      protocolVersion: v2
      modelFormat:
        name: mlflow
        version: "3"
      storageUri: models:/fraud-detector@champion
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 768Mi
