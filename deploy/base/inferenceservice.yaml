# fraud-detector served by KServe (Standard/RawDeployment mode, ADR-0005).
# Reached in-cluster at
#   http://fraud-detector-predictor.fraud.svc/v2/models/fraud-detector/infer
# storageUri is the champion's artifact location in SeaweedFS: MLflow proxies
# mlflow-artifacts:/<path> to s3://mlflow-artifacts/<path>. Hand-set for now
# (fraud-detector v2 = m-6b6c7e5f...); Phase 4 derives it from the alias.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-detector
  namespace: fraud
spec:
  predictor:
    serviceAccountName: kserve-sa
    minReplicas: 1
    maxReplicas: 2
    model:
      runtime: fraud-mlserver
      protocolVersion: v2
      modelFormat:
        name: mlflow
        version: "3"
      storageUri: s3://mlflow-artifacts/4/models/m-6b6c7e5fa7e746d69809cfeb9c43b729/artifacts
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          cpu: "1"
          memory: 768Mi
