apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: registry-exporter
  labels:
    app.kubernetes.io/name: registry-exporter
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-exporter
  endpoints:
    - port: metrics
      path: /metrics
      # Registry state changes slowly; the exporter caches MLflow reads for 30s.
      interval: 60s
      scrapeTimeout: 30s
