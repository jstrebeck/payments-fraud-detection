# Decision thresholds for the served model. Model-specific: taken from the
# champion's evaluation report (recommended_thresholds in
# evaluation/report.json and the model card), not the API's generic 0.5/0.8.
#   fraud-detector v2: review = score at 2% FPR, decline = score at 0.5% FPR.
# When a promotion changes the champion, update these from the new card.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
spec:
  template:
    spec:
      containers:
        - name: payments-api
          env:
            - name: REVIEW_THRESHOLD
              value: "0.019"
            - name: DECLINE_THRESHOLD
              value: "0.138"
            # DRILL (reverted right after): every model call times out, so
            # FraudScorerFallbackHigh must fire. docs/runbooks/scorer-fallback-firing.md
            - name: KSERVE_TIMEOUT_SECONDS
              value: "0.001"
