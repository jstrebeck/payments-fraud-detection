name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint and type check
    # GitHub-hosted so fork PRs are checked too; build/push jobs use the
    # self-hosted runner from Phase 5 (docs/ci-cd.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install (fails if uv.lock is stale)
        run: uv sync --locked --all-packages
      - run: make lint

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-packages
      - name: pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  images:
    name: images build
    # Proves the Dockerfiles and compose file stay valid. Nothing is pushed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker build -f services/payments-api/Dockerfile -t payments-api:ci .
      - run: docker build -f services/simulator/Dockerfile -t simulator:ci .
