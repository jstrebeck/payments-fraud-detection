# Training configuration. Logged verbatim to every MLflow run.

split:
  # Time-based: oldest rows train, then validation (early stopping), then test
  # (the most recent window; used by the promotion gate).
  valid_fraction: 0.15
  test_fraction: 0.15

lightgbm:
  n_estimators: 2000          # upper bound; early stopping picks the real number
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 50
  subsample: 0.8
  subsample_freq: 1
  colsample_bytree: 0.8
  reg_lambda: 1.0
  random_state: 42
  n_jobs: 4
  deterministic: true
  force_row_wise: true
  verbose: -1

early_stopping_rounds: 100

# Integer-coded features LightGBM should treat as categories.
categorical_features:
  - merchant_category_code
  - channel_code

gate:
  min_pr_auc_gain: 0.005
  max_recall_drop: 0.01
  min_pr_auc: 0.5
