[project]
name = "simulator"
version = "0.1.0"
description = "Replays synthetic transactions against the payments API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ml[data]",
    "httpx2>=2.13",
    "prometheus-client>=0.26",
    "structlog>=26.1",
]

[project.scripts]
simulator = "simulator.cli:main"

[tool.uv.sources]
ml = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "simulator"
module-root = ""
