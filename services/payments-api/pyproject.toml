[project]
name = "payments-api"
version = "0.1.0"
description = "FastAPI service that scores payments for fraud and records the decision"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ml[score]",
    "alembic>=1.20",
    "asyncpg>=0.31",
    "fastapi>=0.141",
    "httpx2>=2.13",
    "prometheus-client>=0.26",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
payments-api-migrate = "payments_api.migrate:main"

[tool.uv.sources]
ml = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "payments_api"
module-root = ""
